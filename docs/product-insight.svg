<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">The product insight behind SeriesSearch</title>
  <desc id="desc">People remember stories through characters, scenes, and moods, while catalogs expose metadata. SeriesSearch connects both.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8f6"/>
      <stop offset="1" stop-color="#fff9ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#17343d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#315a63"/>
    </marker>
    <style>
      .eyebrow { font: 700 15px 'DejaVu Sans', sans-serif; fill: #0f766e; }
      .heading { font: 700 34px 'DejaVu Sans', sans-serif; fill: #17343d; }
      .sub { font: 400 17px 'DejaVu Sans', sans-serif; fill: #5e737a; }
      .card-title { font: 700 20px 'DejaVu Sans', sans-serif; fill: #17343d; }
      .copy { font: 400 16px 'DejaVu Sans', sans-serif; fill: #526871; }
      .quote { font: 600 17px 'DejaVu Sans', sans-serif; fill: #17343d; }
      .chip { font: 700 14px 'DejaVu Sans', sans-serif; fill: #fff; }
      .line { fill: none; stroke: #315a63; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="650" fill="url(#bg)"/>
  <text x="70" y="62" class="eyebrow">PRODUCT INSIGHT</text>
  <text x="70" y="108" class="heading">Search starts from memory, not metadata</text>
  <text x="70" y="142" class="sub">A catalog knows fields. A viewer remembers fragments. The product has to connect both.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="440" height="326" rx="8" fill="#ffffff" stroke="#c9dcd7"/>
    <rect x="930" y="190" width="440" height="326" rx="8" fill="#ffffff" stroke="#ead39a"/>
  </g>

  <text x="104" y="232" class="card-title">How viewers describe a show</text>
  <rect x="104" y="262" width="348" height="58" rx="8" fill="#e7f3f0"/>
  <text x="128" y="298" class="quote">“The male lead was a doctor.”</text>
  <rect x="104" y="336" width="348" height="58" rx="8" fill="#eef2fa"/>
  <text x="128" y="372" class="quote">“They broke up in the rain.”</text>
  <rect x="104" y="410" width="348" height="58" rx="8" fill="#fff1e8"/>
  <text x="128" y="446" class="quote">“Warm, but not childish.”</text>

  <text x="1150" y="232" text-anchor="middle" class="card-title">What a catalog exposes</text>
  <g>
    <rect x="982" y="270" width="104" height="42" rx="8" fill="#0f766e"/>
    <text x="1034" y="296" text-anchor="middle" class="chip">YEAR</text>
    <rect x="1098" y="270" width="104" height="42" rx="8" fill="#d18b28"/>
    <text x="1150" y="296" text-anchor="middle" class="chip">GENRE</text>
    <rect x="1214" y="270" width="104" height="42" rx="8" fill="#537aa5"/>
    <text x="1266" y="296" text-anchor="middle" class="chip">REGION</text>
  </g>
  <line x1="982" y1="344" x2="1318" y2="344" stroke="#d9e2df" stroke-width="2"/>
  <text x="1150" y="382" text-anchor="middle" class="copy">Useful when constraints are known</text>
  <text x="1150" y="414" text-anchor="middle" class="copy">Insufficient when memory is narrative</text>
  <text x="1150" y="468" text-anchor="middle" class="quote">The discovery gap</text>

  <path class="line" d="M510 352 H650"/>
  <path class="line" d="M930 352 H790"/>
  <circle cx="720" cy="352" r="78" fill="#17343d"/>
  <text x="720" y="338" text-anchor="middle" class="chip">SERIES</text>
  <text x="720" y="363" text-anchor="middle" class="chip">SEARCH</text>
  <text x="720" y="388" text-anchor="middle" class="chip">BRIDGE</text>

  <rect x="238" y="556" width="410" height="56" rx="8" fill="#17343d"/>
  <text x="443" y="590" text-anchor="middle" class="chip">KNOWN CONSTRAINTS  →  SQL FILTERS</text>
  <rect x="792" y="556" width="410" height="56" rx="8" fill="#b65f3a"/>
  <text x="997" y="590" text-anchor="middle" class="chip">STORY FRAGMENTS  →  SEMANTIC SEARCH</text>
</svg>