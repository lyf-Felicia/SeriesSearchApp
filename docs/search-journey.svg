<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative SeriesSearch user journey</title>
  <desc id="desc">A natural-language request is interpreted, retrieved against two indexes, reranked, and returned with episode evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#17343d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#071f25" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#8fbab2"/>
    </marker>
    <style>
      .eyebrow { font: 700 14px 'DejaVu Sans', sans-serif; fill: #d8f3ef; }
      .heading { font: 700 32px 'DejaVu Sans', sans-serif; fill: #fff; }
      .title { font: 700 18px 'DejaVu Sans', sans-serif; fill: #17343d; }
      .copy { font: 400 14px 'DejaVu Sans', sans-serif; fill: #526871; }
      .small { font: 600 13px 'DejaVu Sans', sans-serif; fill: #526871; }
      .label { font: 700 12px 'DejaVu Sans', sans-serif; fill: #fff; }
      .line { fill: none; stroke: #8fbab2; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="660" fill="url(#bg)"/>
  <text x="70" y="56" class="eyebrow">ILLUSTRATIVE USER JOURNEY</text>
  <text x="70" y="101" class="heading">From a fuzzy memory to a recognizable answer</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="330" height="178" rx="8" fill="#fff"/>
    <rect x="460" y="150" width="280" height="178" rx="8" fill="#fff4d6"/>
    <rect x="800" y="150" width="250" height="178" rx="8" fill="#eef2fa"/>
    <rect x="1110" y="150" width="260" height="178" rx="8" fill="#fff1e8"/>
  </g>

  <rect x="94" y="174" width="82" height="28" rx="8" fill="#0f766e"/>
  <text x="135" y="193" text-anchor="middle" class="label">QUERY</text>
  <text x="100" y="238" class="title">“A sweet modern drama</text>
  <text x="100" y="268" class="title">where the male lead</text>
  <text x="100" y="298" class="title">is a doctor.”</text>

  <rect x="484" y="174" width="96" height="28" rx="8" fill="#d18b28"/>
  <text x="532" y="193" text-anchor="middle" class="label">ANALYZE</text>
  <text x="484" y="240" class="title">PERSONA</text>
  <text x="484" y="272" class="copy">doctor · romance · sweet</text>
  <text x="484" y="304" class="small">interpretable signal</text>

  <rect x="824" y="174" width="86" height="28" rx="8" fill="#537aa5"/>
  <text x="867" y="193" text-anchor="middle" class="label">RECALL</text>
  <text x="824" y="240" class="title">Rich + Basic</text>
  <text x="824" y="272" class="copy">series + episode nodes</text>
  <text x="824" y="304" class="small">30 initial candidates</text>

  <rect x="1134" y="174" width="88" height="28" rx="8" fill="#b65f3a"/>
  <text x="1178" y="193" text-anchor="middle" class="label">RERANK</text>
  <text x="1134" y="240" class="title">Bounded judgment</text>
  <text x="1134" y="272" class="copy">score only retrieved titles</text>
  <text x="1134" y="304" class="small">return final Top-K</text>

  <path class="line" d="M400 239 H460"/>
  <path class="line" d="M740 239 H800"/>
  <path class="line" d="M1050 239 H1110"/>

  <path class="line" d="M1240 328 V385"/>
  <g filter="url(#shadow)">
    <rect x="370" y="390" width="700" height="214" rx="8" fill="#fff"/>
  </g>
  <rect x="400" y="420" width="116" height="30" rx="8" fill="#0f766e"/>
  <text x="458" y="440" text-anchor="middle" class="label">TOP MATCH</text>
  <text x="400" y="492" class="title">Spring Clinic</text>
  <text x="400" y="522" class="copy">Modern romance · medical setting · character fit</text>

  <rect x="400" y="550" width="430" height="34" rx="8" fill="#e7f3f0"/>
  <text x="420" y="572" class="small">Episode evidence: “He stays after hours at the emergency ward…”</text>

  <line x1="866" y1="424" x2="866" y2="572" stroke="#d7dfdc" stroke-width="2"/>
  <text x="900" y="456" class="small">WHY IT MATCHES</text>
  <text x="900" y="492" class="copy">The protagonist’s profession</text>
  <text x="900" y="520" class="copy">and the relationship tone align</text>
  <text x="900" y="548" class="copy">with the request.</text>
  <text x="70" y="632" class="eyebrow">The result is not just ranked—it carries a clue the viewer can recognize.</text>
</svg>