<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">SeriesSearch retrieval design</title>
  <desc id="desc">Rich and basic indexes balance semantic quality with catalog coverage, while series and episode documents preserve evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17343d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#45616a"/>
    </marker>
    <style>
      .eyebrow { font: 700 15px 'DejaVu Sans', sans-serif; fill: #b65f3a; }
      .heading { font: 700 34px 'DejaVu Sans', sans-serif; fill: #17343d; }
      .sub { font: 400 17px 'DejaVu Sans', sans-serif; fill: #5e737a; }
      .title { font: 700 20px 'DejaVu Sans', sans-serif; fill: #17343d; }
      .copy { font: 400 15px 'DejaVu Sans', sans-serif; fill: #526871; }
      .label { font: 700 13px 'DejaVu Sans', sans-serif; fill: #fff; }
      .line { fill: none; stroke: #45616a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="700" fill="#f7f8f5"/>
  <text x="70" y="62" class="eyebrow">INFORMATION ARCHITECTURE</text>
  <text x="70" y="108" class="heading">Quality where possible. Coverage everywhere.</text>
  <text x="70" y="142" class="sub">Two content tracks and two document levels preserve both semantic depth and recognizable evidence.</text>

  <text x="70" y="200" class="title">CONTENT QUALITY</text>
  <g filter="url(#shadow)">
    <rect x="70" y="224" width="370" height="172" rx="8" fill="#e7f3f0" stroke="#8bc5b9"/>
    <rect x="490" y="224" width="370" height="172" rx="8" fill="#eef2fa" stroke="#9eb6d2"/>
  </g>
  <rect x="96" y="248" width="94" height="30" rx="8" fill="#0f766e"/>
  <text x="143" y="268" text-anchor="middle" class="label">RICH</text>
  <text x="96" y="312" class="title">Generated story profiles</text>
  <text x="96" y="344" class="copy">Plot · characters · occupations · style</text>
  <text x="96" y="374" class="copy">Optimizes semantic depth</text>

  <rect x="516" y="248" width="94" height="30" rx="8" fill="#537aa5"/>
  <text x="563" y="268" text-anchor="middle" class="label">BASIC</text>
  <text x="516" y="312" class="title">Source summaries</text>
  <text x="516" y="344" class="copy">Title · synopsis · year · genre · region</text>
  <text x="516" y="374" class="copy">Protects catalog coverage</text>

  <text x="945" y="200" class="title">DOCUMENT LEVEL</text>
  <g filter="url(#shadow)">
    <rect x="945" y="224" width="425" height="172" rx="8" fill="#fff" stroke="#d7dfdc"/>
  </g>
  <rect x="976" y="252" width="148" height="112" rx="8" fill="#fff4d6" stroke="#e5bd58"/>
  <text x="1050" y="294" text-anchor="middle" class="title">Series</text>
  <text x="1050" y="324" text-anchor="middle" class="copy">overall story</text>
  <text x="1050" y="348" text-anchor="middle" class="copy">parent context</text>
  <path class="line" d="M1124 308 H1174"/>
  <rect x="1178" y="252" width="158" height="112" rx="8" fill="#fff1e8" stroke="#d9a88c"/>
  <text x="1257" y="294" text-anchor="middle" class="title">Episodes</text>
  <text x="1257" y="324" text-anchor="middle" class="copy">specific scenes</text>
  <text x="1257" y="348" text-anchor="middle" class="copy">child evidence</text>

  <path class="line" d="M255 396 V474 H570"/>
  <path class="line" d="M675 396 V474 H570"/>
  <path class="line" d="M1157 396 V474 H870"/>

  <g filter="url(#shadow)">
    <rect x="460" y="450" width="520" height="164" rx="8" fill="#17343d"/>
  </g>
  <text x="720" y="492" text-anchor="middle" class="label">MERGE BY SERIES_ID</text>
  <text x="720" y="532" text-anchor="middle" style="font:700 24px 'DejaVu Sans',sans-serif;fill:#fff">One ranked title, evidence intact</text>
  <text x="720" y="570" text-anchor="middle" style="font:400 16px 'DejaVu Sans',sans-serif;fill:#d8e7e4">Keep the strongest score · attach matched episode snippets · remove duplicate titles</text>
  <path class="line" d="M720 614 V657"/>
  <text x="720" y="680" text-anchor="middle" class="copy">The user sees both the recommendation and the clue behind it.</text>
</svg>